<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>高性价比人生指南 · Choose your language</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://streamentry.github.io/HowToLiveBetter/">
<link rel="alternate" hreflang="en" href="https://streamentry.github.io/HowToLiveBetter/en/">
<link rel="alternate" hreflang="vi" href="https://streamentry.github.io/HowToLiveBetter/vi/">
<link rel="alternate" hreflang="zh-CN" href="https://streamentry.github.io/HowToLiveBetter/zh/">
<link rel="alternate" hreflang="x-default" href="https://streamentry.github.io/HowToLiveBetter/">
<style>
body{font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  margin:0;min-height:100vh;display:grid;place-items:center;background:#fff;color:#1b1b1f}
main{max-width:520px;padding:32px 20px;text-align:center}
h1{font-size:22px;margin:0 0 6px}
p{color:rgba(60,60,67,.72);margin:0 0 22px}
ul{list-style:none;padding:0;margin:0;display:grid;gap:10px}
a{display:block;padding:13px 16px;border:1px solid #e2e2e3;border-radius:12px;color:#3451b2;text-decoration:none;font-weight:600}
a:hover{background:#f6f6f7}
small{display:block;font-weight:400;color:rgba(60,60,67,.6);margin-top:3px}
@media (prefers-color-scheme: dark){
  body{background:#1b1b1f;color:#f6f6f7}p{color:rgba(235,235,245,.68)}small{color:rgba(235,235,245,.55)}
  a{border-color:#2b2b2f;color:#93a8ef}a:hover{background:#202127}}
</style>
</head>
<body>
<main>
  <h1>高性价比人生指南</h1>
  <p>选一种语言 · Choose a language</p>
  <ul>
    <li><a href="https://streamentry.github.io/HowToLiveBetter/en/">English</a><small>Default edition</small></li>
    <li><a href="https://streamentry.github.io/HowToLiveBetter/vi/">Tiếng Việt</a><small>Bản dịch tiếng Việt</small></li>
    <li><a href="https://streamentry.github.io/HowToLiveBetter/zh/">中文</a><small>原文，译本以它为准</small></li>
  </ul>
</main>
<script>
  const q = new URLSearchParams(location.search).get('lang');
  const list = [{"code":"en","url":"https://streamentry.github.io/HowToLiveBetter/en/","test":{}},{"code":"vi","url":"https://streamentry.github.io/HowToLiveBetter/vi/","test":{}},{"code":"zh","url":"https://streamentry.github.io/HowToLiveBetter/zh/","test":{}}];
  const dflt = "https://streamentry.github.io/HowToLiveBetter/en/";
  const hit = q ? list.find(l => l.code === q) : list.find(l => l.test.test(navigator.language || ''));
  location.replace((hit && hit.url) || dflt);
</script>
</body>
</html>
